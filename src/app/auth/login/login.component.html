<div class="min-h-screen flex items-center justify-center bg-gray-100 dark:bg-gray-900 px-4">
  <div class="w-full max-w-md bg-white dark:bg-gray-800 rounded-2xl shadow-lg p-8">
    <h2 class="text-2xl font-bold text-center text-gray-800 dark:text-white mb-6">Login</h2>

    <div *ngIf="message" class="text-red-600 text-sm text-center mb-4">{{ message }}</div>

    <form #loginForm="ngForm" (ngSubmit)="onSubmit(loginForm)" class="space-y-4">
      <div>
        <input
          [(ngModel)]="username"
          name="username"
          placeholder="Username"
          required
          #usernameField="ngModel"
          class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
        <div *ngIf="usernameField.invalid && usernameField.touched" class="text-red-500 text-sm mt-1">
          Username is required.
        </div>
      </div>

      <div>
        <input
          [(ngModel)]="password"
          name="password"
          type="password"
          placeholder="Password"
          required
          minlength="4"
          #passwordField="ngModel"
          class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
        <div *ngIf="passwordField.invalid && passwordField.touched" class="text-red-500 text-sm mt-1">
          <div *ngIf="passwordField.errors?.['required']">Password is required.</div>
          <div *ngIf="passwordField.errors?.['minlength']">Minimum 4 characters required.</div>
        </div>
      </div>

      <button
        type="submit"
        [disabled]="loading || loginForm.invalid"
        class="w-full py-2 px-4 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg shadow-md disabled:opacity-50"
      >
        {{ loading ? 'Logging in...' : 'Login' }}
      </button>
    </form>

    <div *ngIf="errorMessage" class="text-red-600 text-sm text-center mt-4">
      {{ errorMessage }}
    </div>

    <p class="text-sm text-center text-gray-700 dark:text-gray-300 mt-4">
      Do not have an account?
      <a routerLink="/register" class="text-blue-600 hover:underline">Register here</a>
    </p>    
  </div>
</div>
