<div class="min-h-screen bg-gray-100 dark:bg-gray-900 px-4 py-8">
  <div class="max-w-3xl mx-auto bg-white dark:bg-gray-800 rounded-2xl shadow-lg p-6">
    <h2 class="text-2xl font-bold text-gray-800 dark:text-white mb-4">Your Credentials</h2>
    <a
      routerLink="/credentials/add"
      class="inline-block px-4 py-2 text-white bg-blue-600 rounded hover:bg-blue-700"
    >
      + Add
    </a>

    <div *ngIf="loading" class="text-gray-600 dark:text-gray-300">Loading credentials...</div>

    <div *ngIf="error" class="text-red-600 dark:text-red-400">{{ error }}</div>

    <div *ngIf="!loading && !error" class="mt-4">
      <input
        type="text"
        placeholder="Search..."
        (input)="onQuickFilterChanged($any($event.target).value)"
        class="mb-2 p-2 border rounded w-full dark:bg-gray-700 dark:border-gray-600 dark:text-white"
      />
      <ag-grid-angular
        style="width: 100%; height: 500px;"
        [class]="currentTheme"
        [columnDefs]="columnDefs"
        [rowData]="credentials"
        [pagination]="true"
        [paginationPageSize]="10"
        [rowSelection]="'single'"
        (rowClicked)="onRowClicked($event)"
        (gridReady)="onGridReady($event)"
        [modules]="modules"
      ></ag-grid-angular>
    </div>

    <button
      (click)="confirmDeleteAccount()"
      class="mt-8 w-full py-2 px-4 bg-red-600 hover:bg-red-700 text-white font-semibold rounded-lg shadow-md"
    >
      Delete My Account
    </button>

  </div>
</div>
